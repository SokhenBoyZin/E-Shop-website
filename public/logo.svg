<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <defs>
    <!-- Modern Gradient -->
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
  </defs>

  <!-- Logo Icon -->
  <g transform="translate(10, 10)">
    <!-- Outer Icon Rounded Box -->
    <rect x="0" y="0" width="80" height="80" rx="22" fill="url(#brandGradient)" />
    <!-- Inner Monogram Element -->
    <path d="M 28 26 L 56 26 C 60 26 60 32 56 32 L 36 32 L 36 37 L 52 37 C 56 37 56 43 52 43 L 36 43 L 36 48 L 56 48 C 60 48 60 54 56 54 L 28 54 C 24 54 24 26 28 26 Z" fill="#FFFFFF" />
    <!-- Accent Dot -->
    <circle cx="56" cy="22" r="5" fill="#38BDF8" />
  </g>

  <!-- Typography -->
  <text x="110" y="58" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" fill="#0F172A" letter-spacing="-1">
    E<tspan fill="url(#brandGradient)">-SHOP</tspan>
  </text>
  <text x="112" y="76" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="600" fill="#64748B" letter-spacing="2">
    PREMIUM STORE
  </text>
</svg>
